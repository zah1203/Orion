name: Enable public web
on:
  workflow_dispatch:
    inputs:
      public_web_url:
        description: 'Exact public_web_url output from the reviewed Infrastructure apply'
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: orion-cloud-changes
  cancel-in-progress: false
jobs:
  activate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      PUBLIC_WEB_URL: ${{ inputs.public_web_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - run: python scripts/activate_public_web.py
