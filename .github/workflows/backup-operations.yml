name: Backup operations
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [status, activate, backup-drill, verify-latest, disable, revoke-escrow]
        default: status
  schedule:
    - cron: '30 23 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: orion-cloud-changes
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.BACKUP_MONITOR_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AWS_REGION: ap-south-1
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      TF_VAR_bucket_name: ${{ vars.BACKUP_BUCKET }}
      TF_VAR_runtime_role_name: ${{ vars.INSTANCE_PROFILE }}
      TF_IN_AUTOMATION: 'true'
      BACKUP_OUTPUTS: /tmp/orion-recovery-outputs.json
      BACKUP_ACTION: ${{ inputs.action || 'status' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-duration-seconds: 3600
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Read recovery stack metadata (no key values in Terraform)
        run: python scripts/cloud_plan.py
        env:
          LIFECYCLE_STACK: recovery
          LIFECYCLE_ACTION: outputs
          OUTPUT_FILE: /tmp/orion-recovery-outputs.json
      - name: Run backup operation
        run: python -m scripts.backup_operations
      - name: Always remove temporary escrow permissions
        if: always()
        run: |
          if test -f "$BACKUP_OUTPUTS"; then
            python -m scripts.backup_operations
          fi
        env:
          BACKUP_ACTION: revoke-escrow
