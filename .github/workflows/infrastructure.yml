name: Infrastructure
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [plan, apply]
        default: plan
      plan_key:
        description: 'For apply: exact manifest S3 key printed by plan'
        type: string
      plan_sha256:
        description: 'For apply: reviewed plan SHA256 printed by plan'
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: orion-cloud-changes
  cancel-in-progress: false
jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: ap-south-1
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      TF_VAR_instance_profile_name: ${{ vars.INSTANCE_PROFILE }}
      TF_VAR_secret_arn: ${{ vars.SECRET_ARN }}
      TF_VAR_artifact_bucket: ${{ vars.ARTIFACT_BUCKET }}
      TF_VAR_ami_id: ${{ vars.AMI_ID }}
      PLAN_ACTION: ${{ inputs.action }}
      PLAN_KEY: ${{ inputs.plan_key }}
      PLAN_SHA256: ${{ inputs.plan_sha256 }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: terraform -chdir=infra init -lockfile=readonly -backend-config="bucket=$STATE_BUCKET"
      - run: terraform -chdir=infra validate
      - run: python scripts/infra_plan.py
